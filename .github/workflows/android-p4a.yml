name: Build Android APK with python-for-android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Kivy APK (p4a, no Buildozer)
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/.android
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android/android-sdk
      ANDROID_SDK_HOME: ${{ github.workspace }}/.android/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/.android/android-ndk
      ANDROIDSDK: ${{ github.workspace }}/.android/android-sdk
      ANDROIDNDK: ${{ github.workspace }}/.android/android-ndk
      ANDROIDAPI: "36"
      NDKAPI: "21"
      ANDROIDNDKVER: "r28c"
      P4A_HOME: ${{ github.workspace }}/p4a

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout python-for-android
        uses: actions/checkout@v4
        with:
          repository: kivy/python-for-android
          path: p4a
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake g++ gcc git \
            lbzip2 libffi-dev libltdl-dev libssl-dev libtool libtool-bin \
            make patch pkg-config unzip wget zip

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ./p4a
          python -m pythonforandroid.toolchain --help >/dev/null

      - name: Install Android SDK and NDK
        run: |
          make -f "$P4A_HOME/ci/makefiles/android.mk" install_sdk install_ndk update_android_sdk

      - name: Verify Android API and NDK
        run: |
          echo "Installed Android platforms:"
          ls -1 "$ANDROID_SDK_ROOT/platforms"
          echo "Installed NDK:"
          cat "$ANDROID_NDK_HOME/RELEASE.TXT" || true

      - name: Build APK with p4a
        run: |
          rm -rf dist
          mkdir -p dist

          python -m pythonforandroid.toolchain apk \
            --private . \
            --package=org.chemistry.periodic118 \
            --name="Periodic Table 118" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --android-api=36 \
            --ndk-api=21 \
            --ndk-version=r28c \
            --sdk-dir="$ANDROID_SDK_ROOT" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            --dist-name=periodic118 \
            --debug

      - name: Collect APK
        run: |
          find . -type f -name "*.apk" -print -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: periodic118-apk-p4a
          path: dist/*.apk
          if-no-files-found: error
