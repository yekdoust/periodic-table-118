name: Build Android APK with python-for-android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-for-android

      - name: Install Android prerequisites
        run: |
          python -m pythonforandroid.toolchain create \
            --dist_name=periodic118 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --copy-libs

      - name: Build APK
        run: |
          python -m pythonforandroid.toolchain apk \
            --private . \
            --dist_name=periodic118 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --package=org.chemistry.periodic118 \
            --name="جدول تناوبی ۱۱۸ عنصر" \
            --version=1.0 \
            --arch=arm64-v8a \
            --debug

      - name: Find APK
        run: |
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: periodic118-apk
          path: "**/*.apk"
